# Local Postgres for development (matches .env.example DATABASE_URL)
# Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: yall
      POSTGRES_PASSWORD: yall
      POSTGRES_DB: yallcomeback
    volumes:
      - yall_pg:/var/lib/postgresql/data

volumes:
  yall_pg:
